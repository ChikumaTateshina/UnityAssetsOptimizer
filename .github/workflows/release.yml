name: Release

# v*.*.* タグの push でパッケージ zip を GitHub Release に公開する。
# VPM リスティング（GitHub Pages）は pages.yml がリリース完了後に更新する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PACKAGE_NAME: com.chikumatateshina.unityassetsoptimizer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          VERSION=$(jq -r .version "Packages/${PACKAGE_NAME}/package.json")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build package zip
        run: |
          cd "Packages/${PACKAGE_NAME}"
          # テストコードは配布に含めない
          zip -r -X "${GITHUB_WORKSPACE}/${PACKAGE_NAME}-${{ steps.version.outputs.version }}.zip" . -x ".*" -x "Editor/Tests/*" -x "Editor/Tests.meta"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: |
            ${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version }}.zip
            Packages/${{ env.PACKAGE_NAME }}/package.json
